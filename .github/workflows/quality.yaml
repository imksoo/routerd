name: Quality

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Git ref to check out before running checks."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-website-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      webconsole: ${{ steps.filter.outputs.webconsole }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          # PR merge-base comparisons require complete ancestry.
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/detect-quality-changes.sh

  webconsole:
    name: Web Console
    # Playwright 1.59.1 in the lockfile does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    needs: detect-website-changes
    if: ${{ needs.detect-website-changes.outputs.webconsole == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webconsole/package-lock.json

      - name: Install Web Console dependencies
        working-directory: webconsole
        run: npm ci

      - name: Audit Web Console dependencies
        working-directory: webconsole
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Type-check Web Console
        working-directory: webconsole
        run: npm run typecheck

      - name: Build Web Console
        working-directory: webconsole
        run: npm run build

      - name: Check generated Web Console assets
        run: git diff --exit-code -- pkg/webconsole/static

  linux-static:
    needs: detect-website-changes
    if: ${{ needs.detect-website-changes.outputs.backend == 'true' }}
    name: Linux static binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Linux release binaries are static
        run: |
          make build-daemons ROUTERD_OS=linux GOARCH=amd64
          make build-provider-executors ROUTERD_OS=linux GOARCH=amd64
          make check-linux-static ROUTERD_OS=linux GOARCH=amd64

  freebsd-cross-compile:
    needs: detect-website-changes
    if: ${{ needs.detect-website-changes.outputs.backend == 'true' }}
    name: FreeBSD cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile FreeBSD binaries and test packages
        run: make check-freebsd-cross-compile

  schema:
    needs: detect-website-changes
    if: ${{ needs.detect-website-changes.outputs.backend == 'true' }}
    name: Generated schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated schemas
        run: make check-schema check-website-schemas

  install-deps-smoke:
    needs: detect-website-changes
    if: ${{ needs.detect-website-changes.outputs.backend == 'true' }}
    name: Installer and release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke install.sh script-dir resolution
        run: bash scripts/install-sh-cwd-smoke.sh

  examples:
    needs: detect-website-changes
    if: ${{ needs.detect-website-changes.outputs.backend == 'true' }}
    name: Example configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate examples
        run: make validate-example

  shellcheck:
    needs: detect-website-changes
    if: ${{ needs.detect-website-changes.outputs.backend == 'true' }}
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck scripts/ci/detect-quality-changes.sh packaging/install.sh packaging/uninstall.sh packaging/bootstrap.sh scripts/pre-commit.sh scripts/release.sh scripts/build-live-iso.sh scripts/install-sh-cwd-smoke.sh tests/e2e/cloudedge/scripts/sam-pve-qga-addresses.sh
