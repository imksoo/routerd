name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9][0-9][0-9][0-9]"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example vYYYYMMDD.HHmm"
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      checkout-ref: ${{ steps.release.outputs.checkout-ref }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
            checkout_ref="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME_VALUE}"
            checkout_ref="${GITHUB_REF_VALUE}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "checkout-ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "routerd ${tag}" \
              --generate-notes \
              --verify-tag \
              --draft
          fi

  quality:
    name: Quality checks
    needs: resolve-release
    uses: ./.github/workflows/quality.yaml
    with:
      checkout-ref: ${{ needs.resolve-release.outputs.checkout-ref }}

  build-archives:
    name: Build ${{ matrix.routerd_os }}-${{ matrix.goarch }}
    needs:
      - resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - routerd_os: linux
            goarch: amd64
          - routerd_os: linux
            goarch: arm64
          - routerd_os: freebsd
            goarch: amd64
          - routerd_os: freebsd
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Debian package
        if: matrix.routerd_os == 'linux'
        run: |
          make deb \
            ROUTERD_OS=linux \
            GOARCH=${{ matrix.goarch }} \
            VERSION=${{ needs.resolve-release.outputs.tag }}

      - name: Build FreeBSD archive
        if: matrix.routerd_os == 'freebsd'
        run: |
          make dist \
            ROUTERD_OS=freebsd \
            GOARCH=${{ matrix.goarch }} \
            VERSION=${{ needs.resolve-release.outputs.tag }}

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          platform="${{ matrix.routerd_os }}-${{ matrix.goarch }}"
          mkdir -p release
          if [ "${{ matrix.routerd_os }}" = linux ]; then
            package="routerd_${tag#v}_${{ matrix.goarch }}.deb"
            alias="routerd-${platform}.deb"
            cp "dist/${platform}/${package}" "dist/${platform}/${package}.sha256" \
              "dist/${platform}/${alias}" "dist/${platform}/${alias}.sha256" release/
          else
            package="routerd-${tag}-${platform}.tar.gz"
            alias="routerd-${platform}.tar.gz"
            cp "dist/${platform}/${package}" "dist/${platform}/${package}.sha256" \
              "dist/${platform}/${alias}" "dist/${platform}/${alias}.sha256" release/
          fi

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.resolve-release.outputs.tag }}" release/* --clobber

  build-ndpi-agent-libndpi:
    name: Build native nDPI agent package linux-amd64
    needs:
      - resolve-release
    # Keep the native agent compatible with baseline x86-64 Ubuntu 24.04 hosts.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native nDPI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev file libndpi-dev pkg-config

      - name: Build native nDPI agent package
        run: |
          make deb-ndpi \
            ROUTERD_OS=linux \
            GOARCH=amd64 \
            VERSION=${{ needs.resolve-release.outputs.tag }}

      - name: Check native nDPI agent CPU baseline
        shell: bash
        run: |
          set -euo pipefail
          readelf --notes bin/linux-amd64/routerd-ndpi-agent > "${RUNNER_TEMP}/elf-notes.txt"
          cat "${RUNNER_TEMP}/elf-notes.txt"
          if grep -Eq 'x86 ISA needed:.*x86-64-v[234]' "${RUNNER_TEMP}/elf-notes.txt"; then
            echo "native nDPI agent requires a CPU ISA newer than baseline x86-64" >&2
            exit 1
          fi

      - name: Collect native nDPI agent package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          package="routerd-ndpi_${tag#v}_amd64.deb"
          alias="routerd-ndpi-linux-amd64.deb"
          mkdir -p release
          cp "dist/linux-amd64/${package}" "dist/linux-amd64/${package}.sha256" \
            "dist/linux-amd64/${alias}" "dist/linux-amd64/${alias}.sha256" release/

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.resolve-release.outputs.tag }}" release/* --clobber

  build-iso:
    name: Build live ISO
    needs:
      - resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap grub-pc-bin grub-efi-amd64-bin mtools xorriso squashfs-tools

      - name: Compute rootfs cache key
        id: rootfs-key
        shell: bash
        run: |
          hash=$(grep -E '^ubuntu_(suite|arch|base_packages|packages)=' scripts/build-live-iso.sh | sha256sum | awk '{print $1}')
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      - name: Cache debootstrap rootfs
        uses: actions/cache@v4
        with:
          path: dist/live/rootfs-cache.tar
          key: live-iso-rootfs-${{ steps.rootfs-key.outputs.hash }}
          restore-keys: |
            live-iso-rootfs-

      - name: Build live ISO
        run: make live-iso VERSION=${{ needs.resolve-release.outputs.tag }}
        env:
          ROOTFS_CACHE_TAR: dist/live/rootfs-cache.tar

      - name: Collect live ISO
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          mkdir -p release
          cp "dist/iso/routerd-live-${tag}.iso" "dist/iso/routerd-live-${tag}.iso.sha256" \
            "dist/iso/routerd-live.iso" "dist/iso/routerd-live.iso.sha256" release/

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.resolve-release.outputs.tag }}" release/* --clobber

  publish:
    name: Publish release
    needs:
      - resolve-release
      - quality
      - build-archives
      - build-ndpi-agent-libndpi
      - build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release edit "${{ needs.resolve-release.outputs.tag }}" --draft=false
