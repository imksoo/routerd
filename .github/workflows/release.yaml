name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9][0-9][0-9][0-9]"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example vYYYYMMDD.HHmm"
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      checkout-ref: ${{ steps.release.outputs.checkout-ref }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
            checkout_ref="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME_VALUE}"
            checkout_ref="${GITHUB_REF_VALUE}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "checkout-ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "routerd ${tag}" \
              --generate-notes \
              --verify-tag \
              --draft
          fi

  quality:
    name: Quality checks
    needs: resolve-release
    uses: ./.github/workflows/quality.yaml
    with:
      checkout-ref: ${{ needs.resolve-release.outputs.checkout-ref }}
      force-website-build: false

  build-deb:
    name: Build Debian package ${{ matrix.goarch }}
    needs: resolve-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native package
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          PACKAGE_ARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          make dist-deb ROUTERD_OS=linux GOARCH="$PACKAGE_ARCH" \
            VERSION="$RELEASE_TAG" PACKAGE_VERSION="1.5.0~${RELEASE_TAG#v}"
          mkdir release
          cp dist/linux-"$PACKAGE_ARCH"/*.deb release/
          dpkg-deb --info release/*.deb
          (cd release && sha256sum ./*.deb > SHA256-linux-"$PACKAGE_ARCH")
      - name: Check native package contract
        if: matrix.goarch == 'amd64'
        run: go test ./tests/nativepackage
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber

  build-pkg:
    name: Build FreeBSD package ${{ matrix.goarch }}
    needs: resolve-release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            vmarch: x86_64
          - goarch: arm64
            vmarch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}
      - name: Build with native FreeBSD tools
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          PACKAGE_ARCH: ${{ matrix.goarch }}
        with:
          release: '14.3'
          arch: ${{ matrix.vmarch }}
          mem: 6144
          envs: 'RELEASE_TAG PACKAGE_ARCH'
          prepare: pkg install -y go gmake python3 dnsmasq ca_root_nss ndpi pkgconf
          run: |
            set -eu
            export GOTOOLCHAIN=$(awk '$1 == "toolchain" { print $2 }' go.mod)
            gmake dist-pkg ROUTERD_OS=freebsd GOARCH="$PACKAGE_ARCH" \
              VERSION="$RELEASE_TAG" PACKAGE_VERSION="1.5.0.a${RELEASE_TAG#v}"
            go test ./tests/nativepackage
            mkdir release
            cp dist/freebsd-"$PACKAGE_ARCH"/*.pkg release/
            pkg info -F release/*.pkg
            (cd release && sha256 -r ./*.pkg > SHA256-freebsd-"$PACKAGE_ARCH")
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber

  build-ndpi-agent-libndpi:
    name: Build native nDPI agent linux-amd64
    needs:
      - resolve-release
    # Keep the native agent compatible with baseline x86-64 Ubuntu 24.04 hosts.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native nDPI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file dpkg-dev libndpi-dev pkg-config

      - name: Build native nDPI agent package
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          make dist-ndpi-agent-libndpi-deb ROUTERD_OS=linux GOARCH=amd64 \
            VERSION="$RELEASE_TAG" PACKAGE_VERSION="1.5.0~${RELEASE_TAG#v}"
          mkdir -p release
          cp dist/linux-amd64/routerd-ndpi-agent-libndpi_*.deb release/
          (cd release && sha256sum ./*.deb > SHA256-ndpi-linux-amd64)

      - name: Smoke test native nDPI agent package
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/routerd-ndpi-agent-libndpi"
          mkdir -p "${work}"
          dpkg-deb --info release/*.deb
          dpkg-deb -x release/*.deb "${work}"
          readelf --notes "${work}/usr/sbin/routerd-ndpi-agent" > "${work}/elf-notes.txt"
          if grep -Eq 'x86 ISA needed:.*x86-64-v[234]' "${work}/elf-notes.txt"; then
            echo "native nDPI agent requires a CPU ISA newer than baseline x86-64" >&2
            exit 1
          fi
          "${work}/usr/sbin/routerd-ndpi-agent" selftest | grep -q '"libndpiLoaded":true'

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.resolve-release.outputs.tag }}" release/* --clobber

  build-iso:
    name: Build live ISO
    needs:
      - resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.checkout-ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap grub-pc-bin grub-efi-amd64-bin mtools xorriso squashfs-tools

      - name: Compute rootfs cache key
        id: rootfs-key
        shell: bash
        run: |
          hash=$(grep -E '^ubuntu_(suite|arch|base_packages|packages)=' scripts/build-live-iso.sh | sha256sum | awk '{print $1}')
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      - name: Cache debootstrap rootfs
        uses: actions/cache@v4
        with:
          path: dist/live/rootfs-cache.tar
          key: live-iso-rootfs-v3-${{ steps.rootfs-key.outputs.hash }}

      - name: Build live ISO
        run: make live-iso VERSION=${{ needs.resolve-release.outputs.tag }}
        env:
          ROOTFS_CACHE_TAR: dist/live/rootfs-cache.tar

      - name: Collect live ISO
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          mkdir -p release
          cp "dist/iso/routerd-live-${tag}.iso" "dist/iso/routerd-live-${tag}.iso.sha256" \
            "dist/iso/routerd-live.iso" "dist/iso/routerd-live.iso.sha256" release/

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.resolve-release.outputs.tag }}" release/* --clobber

  publish:
    name: Publish release
    needs:
      - resolve-release
      - quality
      - build-deb
      - build-pkg
      - build-ndpi-agent-libndpi
      - build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release edit "${{ needs.resolve-release.outputs.tag }}" --draft=false
