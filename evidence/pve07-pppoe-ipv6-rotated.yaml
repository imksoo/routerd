apiVersion: routerd.net/v1alpha1
kind: Router
metadata:
  name: pve07-pppoe-ipv6-rotated
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: lan}
      spec: {ifname: rd15-lan, managed: false, owner: external}
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata: {name: wan}
      spec: {ifname: rd15-wan, managed: false, owner: external}
    - apiVersion: net.routerd.net/v1alpha1
      kind: PPPoESession
      metadata: {name: wan-pppoe}
      spec:
        interface: wan
        ifname: ppp-v6
        username: rd15-v6-user-rotated
        password: rd15-v6-password-rotated
        authMethod: pap
        serviceName: rd15-v6-service
        acName: rd15-v6-ac
        defaultRoute: true
        ipv6: true
        managed: true
    - apiVersion: firewall.routerd.net/v1alpha1
      kind: FirewallZone
      metadata: {name: wan}
      spec: {role: untrust, interfaces: [wan, wan-pppoe]}
    - apiVersion: firewall.routerd.net/v1alpha1
      kind: FirewallPolicy
      metadata: {name: default}
      spec: {}
    - apiVersion: firewall.routerd.net/v1alpha1
      kind: FirewallRule
      metadata: {name: wan-ipv6-echo}
      spec:
        fromZone: wan
        toZone: self
        protocol: icmpv6
        icmpv6Type: echo-request
        action: accept
