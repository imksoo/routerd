apiVersion: routerd.net/v1alpha1
kind: Router
metadata:
  name: nat44-portforward-runtime
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata:
        name: wan
      spec:
        ifname: wan0
        managed: false
        owner: external

    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv4StaticAddress
      metadata:
        name: wan-address
      spec:
        interface: wan
        address: 198.18.16.2/24

    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata:
        name: lan
      spec:
        ifname: lan0
        managed: false
        owner: external

    - apiVersion: net.routerd.net/v1alpha1
      kind: IPv4StaticAddress
      metadata:
        name: lan-address
      spec:
        interface: lan
        address: 198.18.15.1/24

    - apiVersion: firewall.routerd.net/v1alpha1
      kind: PortForward
      metadata:
        name: web
      spec:
        listen:
          interface: wan
          address: 198.18.16.2
          protocol: tcp
          port: 8080
        target:
          address: 198.18.15.100
          port: 8080
        hairpin:
          enabled: true
          interfaces:
            - lan
