apiVersion: routerd.net/v1alpha1
kind: Router
metadata:
  name: local-service-redirect-runtime
spec:
  resources:
    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata:
        name: wan
      spec:
        ifname: wan0
        managed: false
        owner: external

    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata:
        name: lan
      spec:
        ifname: lan0
        managed: false
        owner: external

    - apiVersion: net.routerd.net/v1alpha1
      kind: Interface
      metadata:
        name: lan2
      spec:
        ifname: lan1
        managed: false
        owner: external

    - apiVersion: net.routerd.net/v1alpha1
      kind: IPAddressSet
      metadata:
        name: selected-dns
      spec:
        addresses:
          - 198.18.16.53
          - fd42:16::53

    - apiVersion: firewall.routerd.net/v1alpha1
      kind: LocalServiceRedirect
      metadata:
        name: lan-local-dns
      spec:
        interface: lan
        rules:
          - name: selected-dns
            protocols:
              - tcp
              - udp
            destinationSetRef: IPAddressSet/selected-dns
            destinationPort: 53
            redirectPort: 53
